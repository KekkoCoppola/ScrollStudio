<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" fill="none">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDEDEC"/><stop offset="1" stop-color="#F7F7F6"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F0EF"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E2E1"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C4C4E"/><stop offset=".55" stop-color="#363638"/><stop offset="1" stop-color="#252527"/></linearGradient>
    <radialGradient id="shellHi" cx=".5" cy=".32" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="pot" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FCDCC6"/><stop offset=".45" stop-color="#EDA884"/><stop offset="1" stop-color="#C47254"/></radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4DB6CF"/><stop offset=".5" stop-color="#1E8DB0"/><stop offset="1" stop-color="#0E5A77"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="shade" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="contact" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- floor contact shadows -->
  <ellipse cx="230" cy="300" rx="215" ry="10" fill="#000000" opacity=".05" filter="url(#shade)"/>
  <ellipse cx="236" cy="331" rx="78" ry="6" fill="#000000" opacity=".16" filter="url(#contact)"/>
  <g fill="#000000" opacity=".14" filter="url(#contact)">
    <ellipse cx="30" cy="300" rx="12" ry="2.5"/><ellipse cx="148" cy="300" rx="12" ry="2.5"/>
    <ellipse cx="312" cy="300" rx="12" ry="2.5"/><ellipse cx="430" cy="300" rx="12" ry="2.5"/>
  </g>

  <!-- far legs of the trestles -->
  <path d="M97 108 L103 282" stroke="#ECECEB" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M363 108 L357 282" stroke="#ECECEB" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <!-- shade under the top -->
  <ellipse cx="230" cy="110" rx="200" ry="12" fill="#000000" opacity=".07" filter="url(#shade)"/>

  <!-- trestles, feet on the floor -->
  <polygon points="65,108 72,108 31,300 23,300" fill="url(#leg)"/>
  <polygon points="83,108 87,108 152,300 148,300" fill="#F3F3F2"/>
  <polygon points="388,108 395,108 437,300 429,300" fill="url(#leg)"/>
  <polygon points="373,108 377,108 312,300 308,300" fill="#F3F3F2"/>

  <!-- table top -->
  <path d="M14 85 H446 L450 98 H10 Z" fill="url(#top)"/>
  <rect x="10" y="98" width="440" height="10" fill="url(#edge)"/>
  <rect x="10" y="107.4" width="440" height=".8" fill="#000000" opacity=".06"/>

  <!-- plant -->
  <ellipse cx="337" cy="90" rx="13" ry="2.4" fill="#E79F78" opacity=".35" filter="url(#blur)"/>
  <path d="M337 70 C337 58 335 44 337 12" stroke="#1B6E86" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M336 63 C335 63 334 62 333 62 M338 61 C339 60 339 60 340 60 M337 46 C336 46 335 46 334 46 M338 44 C339 43 339 43 340 43" stroke="#1B6E86" stroke-width="1"/>
  <g fill="url(#leaf)">
    <path d="M336 36 Q344 21 338 5 Q330 20 336 36 Z"/>
    <path d="M338 44 Q353 41 362 28 Q347 31 338 44 Z"/>
    <path d="M335 46 Q320 47 309 36 Q324 35 335 46 Z"/>
    <path d="M338 61 Q354 62 366 50 Q350 49 338 61 Z"/>
    <path d="M335 63 Q320 68 307 60 Q322 55 335 63 Z"/>
  </g>
  <g stroke="#8FD3E3" stroke-width=".5" opacity=".55">
    <path d="M336 35 L338 7"/><path d="M339 43 L360 29"/><path d="M334 45 L311 37"/><path d="M339 60 L364 51"/><path d="M334 62 L309 60"/>
  </g>
  <path d="M325 69 H349 C349 82 344 88 337 88 C330 88 325 82 325 69 Z" fill="url(#pot)"/>
  <ellipse cx="337" cy="69" rx="12" ry="1.7" fill="#F8D2BB"/>
  <ellipse cx="337" cy="69.2" rx="10.2" ry="1.1" fill="#6B4535" opacity=".55"/>

  <!-- chair: Eiffel wire base down to the floor -->
  <g stroke="#1C1C1E" stroke-width="2.2" stroke-linecap="round">
    <path d="M194 205 L158 330"/><path d="M201 206 L186 318"/>
    <path d="M263 206 L277 318"/><path d="M270 205 L312 330"/>
  </g>
  <g stroke="#1C1C1E" stroke-width="1.2" stroke-linecap="round" opacity=".9">
    <path d="M181 250 L296 304"/><path d="M285 250 L170 304"/>
    <path d="M190 268 L274 268"/>
  </g>
  <g fill="#2A2A2C">
    <ellipse cx="206" cy="209" rx="8" ry="3"/><ellipse cx="258" cy="209" rx="8" ry="3"/>
    <ellipse cx="158" cy="330.5" rx="3" ry="1.4"/><ellipse cx="312" cy="330.5" rx="3" ry="1.4"/>
    <ellipse cx="186" cy="318.5" rx="2.6" ry="1.2"/><ellipse cx="277" cy="318.5" rx="2.6" ry="1.2"/>
  </g>

  <!-- chair: shell -->
  <path d="M200 77 Q232 75 264 77 C271 77 276 79 277 85 C283 120 293 160 304 180 C306 184 304 188 299 189 C287 191 276 194 270 199 C267 203 265 207 260 208 L204 208 C199 207 197 203 194 199 C188 194 177 191 165 189 C160 188 158 184 160 180 C171 160 181 120 187 85 C188 79 193 77 200 77 Z" fill="url(#shell)"/>
  <path d="M200 77 Q232 75 264 77 C271 77 276 79 277 85 C283 120 293 160 304 180 C306 184 304 188 299 189 C287 191 276 194 270 199 C267 203 265 207 260 208 L204 208 C199 207 197 203 194 199 C188 194 177 191 165 189 C160 188 158 184 160 180 C171 160 181 120 187 85 C188 79 193 77 200 77 Z" fill="url(#shellHi)" stroke="#5C5C5F" stroke-width=".6" stroke-opacity=".6"/>
  <path d="M166 188 C200 195 264 195 298 188" stroke="#1E1E20" stroke-width="1" opacity=".55"/>
</svg>
