<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-en="ScrollStudio — Services">ScrollStudio — Servizi</title>
  <meta name="description" content="ScrollStudio: web app, strumenti e giochi." data-en-content="ScrollStudio: web apps, tools and games.">
  <meta name="theme-color" content="#E9E9E8">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="room">
    <header class="topbar">
      <div class="topbar__meta">
        <time class="topbar__date" data-today datetime="2018-08-10">Venerdì, 10 ago</time>
        <span class="topbar__climate">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
            <circle cx="8" cy="5" r="3.3"/>
            <circle cx="5" cy="10.4" r="3.3"/>
            <circle cx="11" cy="10.4" r="3.3"/>
          </svg>
          <span data-en="22°, living room">22°, soggiorno</span>
        </span>
      </div>

      <nav class="topbar__nav" aria-label="Principale" data-en-aria-label="Primary">
        <a href="#services" aria-current="page" data-en="Services">Servizi</a>
        <a href="#schedule" data-en="Schedule">Agenda</a>
        <a href="#habitat">Habitat</a>
        <a class="topbar__home" href="#home" aria-label="Home">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 7.2 8 2.6l5.5 4.6v6.3h-11z"/>
            <path d="M2.5 10.9h11"/>
          </svg>
        </a>
      </nav>

      <div class="lang" role="group" aria-label="Lingua" data-en-aria-label="Language">
        <button class="lang__option" type="button" lang="it" aria-label="IT, Italiano" aria-pressed="true" data-lang="it">
          <svg class="lang__flag" viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><path fill="#009246" d="M0 0h1v2H0z"/><path fill="#F4F5F0" d="M1 0h1v2H1z"/><path fill="#CE2B37" d="M2 0h1v2H2z"/></svg>
          IT
        </button>
        <button class="lang__option" type="button" lang="en" aria-label="EN, English" aria-pressed="false" data-lang="en">
          <svg class="lang__flag" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="flag-uk-cross"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path fill="#012169" d="M0 0h60v30H0z"/><path stroke="#FFF" stroke-width="6" d="m0 0 60 30m0-30L0 30"/><path stroke="#C8102E" stroke-width="4" clip-path="url(#flag-uk-cross)" d="m0 0 60 30m0-30L0 30"/><path stroke="#FFF" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"/></svg>
          EN
        </button>
      </div>
    </header>

    <main>
      <h1 class="visually-hidden">ScrollStudio</h1>

      <section class="carousel" id="services" aria-roledescription="carosello" aria-label="Servizi" data-en-aria-roledescription="carousel" data-en-aria-label="Services" data-carousel>
        <button class="carousel__toggle" type="button" aria-pressed="false" data-carousel-toggle data-en="Pause projects">Metti in pausa i progetti</button>

        <!-- Projects: each card plays its video in place of the image (see DESIGN.md) -->
        <ul class="carousel__track" data-carousel-track>
          <li class="carousel__glow" role="presentation" data-carousel-glow></li>

          <li class="carousel__slide">
            <a class="story story--video" href="https://kekkocoppola.github.io/Bouncical/">
              <span class="story__paper"></span>
              <span class="story__media"><video class="story__image" src="assets/projects/bouncical.mp4" style="object-position:50% 0" poster="assets/projects/bouncical.jpg" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video></span>
              <svg class="story__glyph" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/></svg>
              <span class="story__text">
                <span class="story__title">Bouncical</span>
                <span class="story__author" data-en="Physics music sandbox">Musica dalla fisica</span>
              </span>
              <img class="story__avatar" src="assets/projects/bouncical-logo.svg" alt="" draggable="false">
            </a>
            <div class="story__detail">
              <a class="point point--lg" href="https://kekkocoppola.github.io/Bouncical/" target="_blank" rel="noopener" style="--x:271;--y:-40;--xs:228;--ys:-18;--d:0">
                <svg class="point__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>
                <span class="point__title" data-en="Try it">Provalo</span>
                <span class="point__author" data-en="Live demo">Demo live</span>
              </a>
              <a class="point" href="https://github.com/KekkoCoppola/Bouncical" target="_blank" rel="noopener" style="--x:-75;--y:113;--xs:230;--ys:205;--d:1">
                <svg class="point__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 3 1 6l3 3M8 3l3 3-3 3"/></svg>
                <span class="point__title" data-en="Source">Codice</span>
                <span class="point__author">GitHub</span>
              </a>
              <a class="story__plus" href="https://kekkocoppola.github.io/Bouncical/" target="_blank" rel="noopener" aria-label="Apri Bouncical" data-en-aria-label="Open Bouncical">
                <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 8 8 2M3.5 2H8v4.5"/></svg>
              </a>
            </div>
          </li>

          <li class="carousel__slide">
            <a class="story story--video" href="https://kekkocoppola.github.io/TopFratmRanks/">
              <span class="story__paper"></span>
              <span class="story__media"><video class="story__image" src="assets/projects/topfratmranks.mp4" style="object-position:50% 100%" poster="assets/projects/topfratmranks.jpg" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video></span>
              <svg class="story__glyph" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M1.5 10.5h9M3 10.5V7M6 10.5V2M9 10.5V5"/></svg>
              <span class="story__text">
                <span class="story__title">TopFratmRanks</span>
                <span class="story__author" data-en="Ranking video maker">Crea video classifica</span>
              </span>
              <img class="story__avatar" src="assets/projects/topfratmranks-logo.svg" alt="" draggable="false">
            </a>
            <div class="story__detail">
              <a class="point point--lg" href="https://kekkocoppola.github.io/TopFratmRanks/" target="_blank" rel="noopener" style="--x:271;--y:-40;--xs:228;--ys:-18;--d:0">
                <svg class="point__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>
                <span class="point__title" data-en="Try it">Provalo</span>
                <span class="point__author" data-en="Live demo">Demo live</span>
              </a>
              <a class="point" href="https://github.com/KekkoCoppola/TopFratmRanks" target="_blank" rel="noopener" style="--x:-75;--y:113;--xs:230;--ys:205;--d:1">
                <svg class="point__icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 3 1 6l3 3M8 3l3 3-3 3"/></svg>
                <span class="point__title" data-en="Source">Codice</span>
                <span class="point__author">GitHub</span>
              </a>
              <a class="story__plus" href="https://kekkocoppola.github.io/TopFratmRanks/" target="_blank" rel="noopener" aria-label="Apri TopFratmRanks" data-en-aria-label="Open TopFratmRanks">
                <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 8 8 2M3.5 2H8v4.5"/></svg>
              </a>
            </div>
          </li>
        </ul>
      </section>

      <section class="intro" aria-labelledby="intro-title">
        <span class="intro__mark" aria-hidden="true"></span>
        <h2 class="intro__title" id="intro-title" data-en="Services">Servizi</h2>
        <p class="intro__tags" data-en="Web apps, Tools, Games">Web app, Strumenti, Giochi</p>
      </section>
    </main>

    <figure class="scene" aria-hidden="true">
      <img src="assets/scene/desk-scene.svg" alt="" width="460" height="360">
    </figure>
  </div>

  <footer class="footer">
    <span class="footer__brand"><span class="intro__mark" aria-hidden="true"></span>ScrollStudio</span>
    <span>© 2026</span>
  </footer>
</body>
</html>
